        mode: fixed
        id: comet
        speed: 1
        intensity: 1
        params:
          speed: 3.0
          count: 2
          trajectory: bounce
          tail_length: 0.20
          decay: 0.8
          phase_spacing: 0.5
      color: {mode: solid, color: [0.03, 0.2, 1.0]}

