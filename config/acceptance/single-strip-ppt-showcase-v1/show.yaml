schema_version: 2
show:
  id: single-strip-ppt-showcase-v1
  duration: 116.0
  defaults:
    fade_in: 0
    fade_out: 0
    blend: replace
    min_effect_hold: 0
    switch_cooldown: 0
  cues:
    - id: BLACK_start
      start: 0.0
      end: 2.0
      priority: 0
      target: {type: digital_strip, id: strip_31}
      origin: start
      effect: {mode: fixed, id: static, speed: 1, intensity: 1, params: {}}
      color: {mode: solid, color: [0, 0, 0]}
      transition: {fade_in: 0, fade_out: 0, blend: replace}

    - id: COMET_cool_single_wrap
      start: 2.0
      end: 8.0
      priority: 0
      target: {type: digital_strip, id: strip_31}
      origin: start
      effect:
        mode: fixed
        id: comet
        speed: 1
        intensity: 1
        params:
          speed: 2.5
          count: 1
          trajectory: wrap
          tail_length: 0.25
          decay: 0.8
          phase_spacing: 1
      color: {mode: solid, color: [0.85, 0.9, 1.0]}

    - id: COMET_blue_double_bounce
      start: 8.0
      end: 15.0
      priority: 0
