# mpv kiosk input bindings for LIGHT-BELT
# Space uses mpv's native pause toggle; engine_adapter polls mpv state and picks it up.
# Esc calls the REST API for a clean stop (tears down light_engine + mpv), returning to the Chromium UI.
SPACE cycle pause
ESC run "/bin/curl" "-s" "-X" "POST" "http://localhost:8443/api/v1/playback/stop"
