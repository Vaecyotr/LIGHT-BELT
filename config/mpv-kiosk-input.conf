# mpv kiosk input bindings for LIGHT-BELT
# Space: mpv native pause toggle; engine_adapter polls mpv state.
# Esc: REST API clean stop (tears down light_engine + mpv goes idle).
SPACE cycle pause
ESC run "/bin/curl" "-s" "-X" "POST" "http://localhost:8443/api/v1/playback/stop"

# 禁止触屏 / 鼠标操作导致退出全屏或触发 OSD
MBTN_LEFT ignore
MBTN_LEFT_DBL ignore
MBTN_RIGHT ignore
