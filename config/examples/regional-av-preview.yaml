schema_version: 2

show:
  id: regional-av-preview
  duration: 60.0
  defaults: {fade_in: 0.0, fade_out: 0.0, blend: replace}
  cues:
    - id: regional-picture-with-music
      start: 0.0
      end: 60.0
      target:
        type: digital_set
        ids: [strip_32, strip_31, strip_41, strip_43, strip_44, strip_11, strip_12, strip_21, strip_22]
      effect:
        mode: fixed
        id: video_audio_fusion
        params: {video_weight: 1.0, audio_weight: 0.85, bass_boost: 1.15, treble_limit: 0.0}
      color: {mode: effect_default}
